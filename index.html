
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ayman | Premium Photography</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500;600&family=Inter:wght@100;300;400&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-color: #000000;
      --text-color: #ffffff;
    }
    body {
      font-family: 'Inter', sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      margin: 0;
      overflow-x: hidden;
      -webkit-font-smoothing: antialiased;
      perspective: 1000px; /* Enable 3D context */
    }
    h1, h2, h3, .font-serif {
      font-family: 'Cormorant Garamond', serif;
      font-weight: 300;
      letter-spacing: -0.02em;
    }
    .reveal {
      opacity: 0;
      transform: translateY(60px);
      transition: all 1.4s cubic-bezier(0.16, 1, 0.3, 1);
      will-change: transform, opacity;
    }
    .reveal.active {
      opacity: 1;
      transform: translateY(0);
    }
    .scrollbar-hide::-webkit-scrollbar {
      display: none;
    }
    /* 3D Image Container Styles */
    .parallax-container {
      overflow: hidden;
      position: relative;
    }
    .parallax-image {
      will-change: transform;
      height: 120%; /* Taller than container for movement */
      top: -10%;
    }
  </style>
<script type="importmap">

    "react/": "https://esm.sh/react@^19.2.3/",

    "@google/genai": "https://esm.sh/@google/genai@^1.34.0"
  }
}
</script>
</head>
<body>
  <div id="root"></div>
</body>
</html>
